name: Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing semantic-version tag to publish (for example, v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-docker
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.version || github.ref_name }}
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/synthient-mcp

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
      commit: ${{ steps.release.outputs.commit }}
      build_date: ${{ steps.release.outputs.build_date }}
    steps:
      - name: Validate semantic version
        shell: bash
        run: |
          identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          semver_re="^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${identifier}(\\.${identifier})*)?$"
          if [[ ! "$RELEASE_REF" =~ $semver_re ]]; then
            echo "Release ref must be an exact semantic version beginning with v; build metadata is not supported" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture release metadata
        id: release
        shell: bash
        run: |
          version="${RELEASE_REF#v}"
          stable=true
          if [[ "$version" == *-* ]]; then stable=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          check-latest: true
          cache-dependency-path: go/go.sum

      - name: Run release checks
        run: make fmt-check tidy-check vet staticcheck test race vuln build docker-check

  publish:
    name: Build and push
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.stable == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=Synthient MCP Server
            org.opencontainers.image.description=Dockerized MCP server for the Synthient intelligence API

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            COMMIT=${{ needs.verify.outputs.commit }}
            BUILD_DATE=${{ needs.verify.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Report immutable digest
        run: echo "Published $IMAGE_NAME@${{ steps.build.outputs.digest }}"
